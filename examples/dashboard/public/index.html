<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<title>apibaseball — test dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #dde1e6;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #2563eb;
    --ok: #16803c;
    --ok-bg: #e6f4ea;
    --fail: #b91c1c;
    --fail-bg: #fce8e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #2a2e37;
      --text: #e6e8eb;
      --muted: #9aa2ad;
      --accent: #5b8def;
      --ok: #4ade80;
      --ok-bg: #103820;
      --fail: #f87171;
      --fail-bg: #3a1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .card h2 {
    font-size: 0.95rem;
    margin: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card .endpoint {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .fields {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .fields label {
    font-size: 0.72rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .fields input {
    font-size: 0.8rem;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    width: 110px;
  }
  button.run {
    align-self: flex-start;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button.run:disabled { opacity: 0.6; cursor: default; }
  .status {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .status.ok { color: var(--ok); background: var(--ok-bg); }
  .status.fail { color: var(--fail); background: var(--fail-bg); }
  pre {
    margin: 0;
    max-height: 260px;
    overflow: auto;
    font-size: 0.72rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .runall {
    margin-bottom: 16px;
    background: var(--ok);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.85rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>apibaseball — test dashboard</h1>
  <p class="sub">Testeaza toate cele 11 metode ale SDK-ului direct din browser (cheia API ramane pe server).</p>
  <button class="runall" id="runAll">Ruleaza toate metodele</button>
  <div class="grid" id="grid"></div>

<script>
function todayPlus(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

const METHODS = [
  {
    key: "countries",
    title: "getCountries",
    endpoint: "GET /api/countries",
    fields: [],
    url: () => "/api/countries",
  },
  {
    key: "leagues",
    title: "getLeagues",
    endpoint: "GET /api/leagues",
    fields: [
      { name: "page", value: "1" },
      { name: "itemsPerPage", value: "15" },
    ],
    url: (v) => `/api/leagues?page=${v.page}&itemsPerPage=${v.itemsPerPage}`,
  },
  {
    key: "leaguesByCountry",
    title: "getLeaguesByCountry",
    endpoint: "GET /api/leagues/by-country/:countryId",
    fields: [{ name: "countryId", value: "312" }],
    url: (v) => `/api/leagues/by-country/${v.countryId}`,
  },
  {
    key: "teamsByLeague",
    title: "getTeamsByLeague",
    endpoint: "GET /api/teams/by-league/:leagueId",
    fields: [{ name: "leagueId", value: "11590" }],
    url: (v) => `/api/teams/by-league/${v.leagueId}`,
  },
  {
    key: "players",
    title: "getPlayers",
    endpoint: "GET /api/players",
    fields: [
      { name: "teamId", value: "82" },
      { name: "leagueId", value: "" },
    ],
    url: (v) => `/api/players?teamId=${v.teamId}&leagueId=${v.leagueId}`,
  },
  {
    key: "games",
    title: "getGames",
    endpoint: "GET /api/games",
    fields: [
      { name: "from", value: todayPlus(-3) },
      { name: "to", value: todayPlus(3) },
      { name: "leagueId", value: "11590" },
    ],
    url: (v) => `/api/games?from=${v.from}&to=${v.to}&leagueId=${v.leagueId}`,
  },
  {
    key: "live",
    title: "getLiveGames",
    endpoint: "GET /api/live",
    fields: [],
    url: () => "/api/live",
  },
  {
    key: "injuries",
    title: "getTeamInjuries",
    endpoint: "GET /api/teams/:teamId/injuries",
    fields: [{ name: "teamId", value: "82" }],
    url: (v) => `/api/teams/${v.teamId}/injuries`,
  },
  {
    key: "teamStats",
    title: "getTeamStats",
    endpoint: "GET /api/teams/:teamId/stats",
    fields: [{ name: "teamId", value: "82" }],
    url: (v) => `/api/teams/${v.teamId}/stats`,
  },
  {
    key: "odds",
    title: "getOdds",
    endpoint: "GET /api/odds",
    fields: [
      { name: "from", value: todayPlus(0) },
      { name: "to", value: todayPlus(4) },
    ],
    url: (v) => `/api/odds?from=${v.from}&to=${v.to}`,
  },
  {
    key: "standings",
    title: "getStandings",
    endpoint: "GET /api/standings/:leagueId",
    fields: [{ name: "leagueId", value: "11590" }],
    url: (v) => `/api/standings/${v.leagueId}`,
  },
];

const grid = document.getElementById("grid");

function renderCard(method) {
  const card = document.createElement("div");
  card.className = "card";

  const fieldsHtml = method.fields
    .map(
      (f) =>
        `<label>${f.name}<input data-field="${f.name}" value="${f.value}" /></label>`
    )
    .join("");

  card.innerHTML = `
    <h2><span>${method.title}</span><span class="status" id="status-${method.key}"></span></h2>
    <div class="endpoint">${method.endpoint}</div>
    <div class="fields">${fieldsHtml}</div>
    <button class="run" id="run-${method.key}">Run</button>
    <pre id="out-${method.key}">-</pre>
  `;
  grid.appendChild(card);

  const btn = card.querySelector(`#run-${method.key}`);
  btn.addEventListener("click", () => execute(method));
}

async function execute(method) {
  const card = document.getElementById(`out-${method.key}`).closest(".card");
  const values = {};
  card.querySelectorAll("[data-field]").forEach((el) => {
    values[el.dataset.field] = el.value;
  });

  const statusEl = document.getElementById(`status-${method.key}`);
  const outEl = document.getElementById(`out-${method.key}`);
  const btn = document.getElementById(`run-${method.key}`);

  btn.disabled = true;
  statusEl.textContent = "...";
  statusEl.className = "status";
  outEl.textContent = "Loading...";

  try {
    const res = await fetch(method.url(values));
    const json = await res.json();
    statusEl.textContent = json.ok ? `OK ${json.ms}ms` : `FAIL ${json.status ?? ""}`;
    statusEl.className = "status " + (json.ok ? "ok" : "fail");
    outEl.textContent = JSON.stringify(json.ok ? json.data : json, null, 2);
  } catch (err) {
    statusEl.textContent = "FAIL";
    statusEl.className = "status fail";
    outEl.textContent = String(err);
  } finally {
    btn.disabled = false;
  }
}

METHODS.forEach(renderCard);

document.getElementById("runAll").addEventListener("click", () => {
  METHODS.forEach((m) => execute(m));
});
</script>
</body>
</html>
